<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="10時と11時の2本の折れ線。Aは18から20℃、Bは14から17℃。横軸は1時間、縦軸は1℃ずつ同じ間隔。" font-family="Noto Sans JP, sans-serif"><title>2本の線を見る</title><rect width="600" height="400" rx="12" fill="#fffdf8"/><line x1="110" y1="285" x2="460" y2="285" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><text x="85" y="292" font-size="24" fill="#697164" text-anchor="middle">12</text><line x1="110" y1="263" x2="460" y2="263" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><line x1="110" y1="241" x2="460" y2="241" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><text x="85" y="248" font-size="24" fill="#697164" text-anchor="middle">14</text><line x1="110" y1="219" x2="460" y2="219" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><line x1="110" y1="197" x2="460" y2="197" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><text x="85" y="204" font-size="24" fill="#697164" text-anchor="middle">16</text><line x1="110" y1="175" x2="460" y2="175" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><line x1="110" y1="153" x2="460" y2="153" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><text x="85" y="160" font-size="24" fill="#697164" text-anchor="middle">18</text><line x1="110" y1="131" x2="460" y2="131" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><line x1="110" y1="109" x2="460" y2="109" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><text x="85" y="116" font-size="24" fill="#697164" text-anchor="middle">20</text><line x1="110" y1="87" x2="460" y2="87" stroke="#dce3d9" stroke-width="1" stroke-linecap="round"/><text x="85" y="55" font-size="25" fill="#697164" text-anchor="middle">℃</text><text x="165" y="320" font-size="28" fill="#343c32" text-anchor="middle">10時</text><text x="400" y="320" font-size="28" fill="#343c32" text-anchor="middle">11時</text><line x1="165" y1="153" x2="400" y2="109" stroke="#467060" stroke-width="5" stroke-linecap="round"/><line x1="165" y1="241" x2="400" y2="175" stroke="#887e4c" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 7"/><circle cx="165" cy="153" r="6" fill="#467060"/><text x="140" y="141" font-size="26" fill="#467060" text-anchor="middle">18</text><circle cx="400" cy="109" r="6" fill="#467060"/><text x="375" y="97" font-size="26" fill="#467060" text-anchor="middle">20</text><circle cx="165" cy="241" r="6" fill="#887e4c"/><text x="140" y="229" font-size="26" fill="#887e4c" text-anchor="middle">14</text><circle cx="400" cy="175" r="6" fill="#887e4c"/><text x="375" y="163" font-size="26" fill="#887e4c" text-anchor="middle">17</text><text x="495" y="95" font-size="29" fill="#467060" text-anchor="middle">A</text><text x="495" y="155" font-size="29" fill="#887e4c" text-anchor="middle">B</text><text x="300" y="380" font-size="32" fill="#467060" text-anchor="middle">同じ時刻の2点を見る</text></svg>
