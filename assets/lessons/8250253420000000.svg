<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="同じ大きさの四角が三列に2こ、4こ、6こ。全部で12こ。" font-family="Noto Sans JP, sans-serif"><title>同じ大きさの四角が三列に2こ、4こ、6こ。全部で12こ。</title><text x="300" y="40" font-size="28" fill="#343c32" text-anchor="middle">合計12こは変わらない</text><rect id="average-block-0-0" x="125" y="260" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-0-1" x="125" y="230" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-1-0" x="275" y="260" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-1-1" x="275" y="230" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-1-2" x="275" y="200" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-1-3" x="275" y="170" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-2-0" x="425" y="260" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-2-1" x="425" y="230" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-2-2" x="425" y="200" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-2-3" x="425" y="170" width="50" height="30" fill="#dce9df" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-2-4" x="425" y="140" width="50" height="30" fill="#f4d9b5" stroke="#467060" stroke-width="1.5" opacity="1"/><rect id="average-block-2-5" x="425" y="110" width="50" height="30" fill="#f4d9b5" stroke="#467060" stroke-width="1.5" opacity="1"/><text x="150" y="330" font-size="27" fill="#343c32" text-anchor="middle">2</text><text x="300" y="330" font-size="27" fill="#343c32" text-anchor="middle">4</text><text x="450" y="330" font-size="27" fill="#343c32" text-anchor="middle">6</text><text x="300" y="375" font-size="31" fill="#467060" text-anchor="middle">2 + 4 + 6 = 12</text></svg>
