<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="四枚の固定した札に2x、3y、x、−y。札は式の項で、物体の個数や面積ではない。" font-family="Noto Sans JP, sans-serif"><title>四枚の固定した札に2x、3y、x、−y。札は式の項で、物体の個数や面積ではない。</title><text x="300" y="40" font-size="31" fill="#343c32" text-anchor="middle">(2x+3y)+(x−y)</text><rect id="jh2-scene-poly-term-0" x="62" y="95" width="110" height="88" fill="#dce9df" stroke="#467060" stroke-width="2"/><text id="jh2-scene-poly-term-value-0" x="117" y="150" font-size="32" fill="#343c32" text-anchor="middle">2x</text><rect id="jh2-scene-poly-term-1" x="184" y="95" width="110" height="88" fill="#dce9df" stroke="#467060" stroke-width="2"/><text id="jh2-scene-poly-term-value-1" x="239" y="150" font-size="32" fill="#343c32" text-anchor="middle">3y</text><rect id="jh2-scene-poly-term-2" x="306" y="95" width="110" height="88" fill="#dce9df" stroke="#467060" stroke-width="2"/><text id="jh2-scene-poly-term-value-2" x="361" y="150" font-size="32" fill="#343c32" text-anchor="middle">x</text><rect id="jh2-scene-poly-term-3" x="428" y="95" width="110" height="88" fill="#dce9df" stroke="#467060" stroke-width="2"/><text id="jh2-scene-poly-term-value-3" x="483" y="150" font-size="32" fill="#343c32" text-anchor="middle">−y</text><text id="jh2-scene-poly-result" x="300" y="285" font-size="32" fill="#343c32" text-anchor="middle">文字部分が同じ項を探す</text><text id="jh2-scene-summary" x="300" y="378" font-size="28" fill="#343c32" text-anchor="middle">札の位置と、項の符号を保つ</text></svg>
