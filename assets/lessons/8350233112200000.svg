<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="1から2の数直線と、1²&lt;2&lt;2²を表示する。√2の点は正確な位置に置く。" font-family="Noto Sans JP, sans-serif"><title>1から2の数直線と、1²&lt;2&lt;2²を表示する。√2の点は正確な位置に置く。</title><text x="300" y="35" font-size="25" fill="#343c32" text-anchor="middle">全体の位置：1から2</text><line id="jh3-scene-approx-axis" x1="100" y1="85" x2="500" y2="85" stroke="#343c32" stroke-width="2.5"/><circle id="jh3-scene-approx-root" cx="265.68542" cy="85" r="6" fill="#ad672b" stroke="#343c32" stroke-width="1.5"/><text x="100" y="120" font-size="24" fill="#343c32" text-anchor="middle">1</text><text x="500" y="120" font-size="24" fill="#343c32" text-anchor="middle">2</text><text x="265.68542" y="70" font-size="25" fill="#343c32" text-anchor="middle">√2</text><text x="300" y="166" font-size="25" fill="#343c32" text-anchor="middle">同じ区間を見る</text><line id="jh3-scene-approx-detail-axis" x1="100" y1="215" x2="500" y2="215" stroke="#343c32" stroke-width="2.5"/><line id="jh3-scene-approx-interval-trace" x1="100" y1="215" x2="500" y2="215" stroke="#ad672b" stroke-width="4"/><circle id="jh3-scene-approx-detail-root" cx="265.68542" cy="215" r="6" fill="#ad672b" stroke="#343c32" stroke-width="1.5"/><text id="jh3-scene-approx-low" x="100" y="250" font-size="25" fill="#343c32" text-anchor="middle">1</text><text id="jh3-scene-approx-high" x="500" y="250" font-size="25" fill="#343c32" text-anchor="middle">2</text><text x="265.68542" y="202" font-size="25" fill="#343c32" text-anchor="middle">√2</text><text id="jh3-scene-approx-left-square" x="165" y="298" font-size="25" fill="#343c32" text-anchor="middle">1²=1</text><text id="jh3-scene-approx-right-square" x="435" y="330" font-size="25" fill="#343c32" text-anchor="middle">2²=4</text><text id="jh3-scene-summary" x="300" y="377" font-size="27" fill="#343c32" text-anchor="middle">1 &lt; √2 &lt; 2</text></svg>
