<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="同じ縮尺の帯でA3枚、B5枚を示す。1区間はどちらも1枚。" font-family="Noto Sans JP, sans-serif"><title>もとの量を見る</title><rect width="600" height="400" rx="12" fill="#fffdf8"/><text x="50" y="140" font-size="33" fill="#467060" text-anchor="middle">A</text><text x="50" y="245" font-size="33" fill="#887e4c" text-anchor="middle">B</text><rect x="110" y="105" width="75" height="45" rx="2" fill="#467060" stroke="none" opacity="1"/><rect x="110" y="210" width="125" height="45" rx="2" fill="#887e4c" stroke="none" opacity="1"/><line x1="135" y1="105" x2="135" y2="150" stroke="#fffdf8" stroke-width="1" stroke-linecap="round"/><line x1="135" y1="210" x2="135" y2="255" stroke="#fffdf8" stroke-width="1" stroke-linecap="round"/><line x1="160" y1="105" x2="160" y2="150" stroke="#fffdf8" stroke-width="1" stroke-linecap="round"/><line x1="160" y1="210" x2="160" y2="255" stroke="#fffdf8" stroke-width="1" stroke-linecap="round"/><line x1="185" y1="210" x2="185" y2="255" stroke="#fffdf8" stroke-width="1" stroke-linecap="round"/><line x1="210" y1="210" x2="210" y2="255" stroke="#fffdf8" stroke-width="1" stroke-linecap="round"/><text x="197" y="138" font-size="28" fill="#467060" text-anchor="start">3枚</text><text x="247" y="243" font-size="28" fill="#887e4c" text-anchor="start">5枚</text><text x="300" y="70" font-size="27" fill="#697164" text-anchor="middle">同じ1マスが1枚</text><text x="300" y="380" font-size="32" fill="#467060" text-anchor="middle">もと：Aは3枚、Bは5枚</text></svg>
